<!doctype html>
<html lang="fr">
<head>
  <!-- Métadonnées : encodage, affichage mobile plein écran et description -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Football Simulator</title>
  <meta name="description" content="Tableau tactique de football en réalité augmentée, dans le navigateur.">
  <meta name="theme-color" content="#0f4a2a">

  <!-- Application installable : manifeste et icônes -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <!-- Feuille de style principale -->
  <link rel="stylesheet" href="src/styles.css">

  <!-- Carte d'import : « three » pointe vers la copie locale, servie depuis la même origine -->
  <script type="importmap">
    {
      "imports": {
        "three": "./src/vendor/three/build/three.module.js",
        "three/addons/": "./src/vendor/three/examples/jsm/"
      }
    }
  </script>

  <!-- Point d'entrée JavaScript (module, exécuté après l'analyse de la page) -->
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <!-- Zone de rendu 3D : le canvas three.js y est inséré -->
  <main id="scene-container" aria-label="Terrain de football en 3D"></main>

  <!-- Interface superposée ; elle servira de racine au DOM Overlay en AR (sprint 2) -->
  <div id="overlay">
    <!-- Bandeau supérieur : nom de l'application, état de l'AR et formations en place -->
    <header class="topbar">
      <div class="topbar__group">
        <h1 class="brand">Football Simulator</h1>
        <span id="xr-status" class="status" data-state="checking" role="status">Vérification de l’AR…</span>
      </div>
      <ul class="teams" aria-label="Formations en place">
        <li class="team-chip team-chip--blue">Bleus <strong id="formation-blue" data-formation></strong></li>
        <li class="team-chip team-chip--red">Rouges <strong id="formation-red" data-formation></strong></li>
      </ul>
    </header>

    <!-- Bandeau inférieur : aide aux gestes, message d'échec de l'AR et actions.
         « Entrer en AR » n'apparaît que si l'AR est disponible ; pendant une session,
         « Quitter l'AR » remplace « Recentrer » et « Entrer en AR ». -->
    <footer class="bottombar">
      <p id="hint" class="hint">Glissez pour tourner, pincez pour zoomer.</p>
      <p id="ar-message" class="notice" role="alert" hidden></p>
      <div class="actions">
        <button id="reset-view" class="button" type="button">Recentrer</button>
        <button id="enter-ar" class="button" type="button" hidden>Entrer en AR</button>
        <button id="exit-ar" class="button button--secondary" type="button" hidden>Quitter l’AR</button>
      </div>
    </footer>
  </div>

  <!-- Écran de chargement, masqué dès que la scène est prête -->
  <div id="loader" class="loader" role="status">Chargement du terrain…</div>

  <!-- Message affiché si JavaScript est désactivé -->
  <noscript>
    <p class="noscript">Football Simulator a besoin de JavaScript pour afficher le terrain.</p>
  </noscript>
</body>
</html>
