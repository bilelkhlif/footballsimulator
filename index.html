<!doctype html>
<html lang="fr">
<head>
  <!-- Métadonnées : encodage, affichage mobile plein écran et description -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Football Simulator</title>
  <meta name="description" content="Tableau tactique de football en réalité augmentée, dans le navigateur.">
  <meta name="theme-color" content="#0f4a2a">

  <!-- Application installable : manifeste et icônes -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <!-- Feuille de style principale -->
  <link rel="stylesheet" href="src/styles.css">

  <!-- Carte d'import : three.js r187, version WebGPU, copiée dans le dépôt et servie depuis la même origine.
       « three » pointe vers le build WebGPU : le build WebGL (three.module.js) n'est pas livré. -->
  <script type="importmap">
    {
      "imports": {
        "three": "./src/vendor/three-r187/build/three.webgpu.js",
        "three/webgpu": "./src/vendor/three-r187/build/three.webgpu.js",
        "three/tsl": "./src/vendor/three-r187/build/three.tsl.js",
        "three/addons/": "./src/vendor/three-r187/examples/jsm/"
      }
    }
  </script>

  <!-- Point d'entrée JavaScript (module, exécuté après l'analyse de la page) -->
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <!-- Zone de rendu 3D : le canvas WebGPU de three.js y est inséré -->
  <main id="scene-container" aria-label="Terrain de football en 3D"></main>

  <!-- Interface superposée ; c'est la racine du DOM Overlay en AR -->
  <div id="overlay">
    <!-- Bandeau supérieur : nom de l'application, état de l'AR, du rendu et du réseau, formations -->
    <header class="topbar">
      <div class="topbar__group">
        <h1 class="brand">Football Simulator</h1>
        <span id="xr-status" class="status" data-state="checking" role="status">Vérification de l’AR…</span>
        <span id="gpu-status" class="status" data-state="checking">Démarrage de WebGPU…</span>
        <span id="network-status" class="status" data-state="offline" hidden>Hors-ligne</span>
      </div>
      <ul class="teams" aria-label="Formations en place">
        <li class="team-chip team-chip--blue">Bleus <strong id="formation-blue" data-formation></strong></li>
        <li class="team-chip team-chip--red">Rouges <strong id="formation-red" data-formation></strong></li>
      </ul>
    </header>

    <!-- Bandeau inférieur : aide aux gestes, messages, formations et actions.
         « Entrer en AR » n'apparaît que si l'AR est disponible ; pendant une session,
         « Déplacer le terrain » et « Quitter l'AR » remplacent les autres boutons, et
         « Formations » n'apparaît qu'une fois le terrain posé. -->
    <footer class="bottombar">
      <p id="hint" class="hint">Glissez pour tourner, pincez pour zoomer.</p>
      <p id="ar-message" class="notice" role="alert" hidden></p>
      <p id="update-notice" class="notice notice--info" role="status" hidden>
        Nouvelle version installée.
        <button id="reload-app" class="button button--small" type="button">Recharger</button>
      </p>
      <!-- Panneau des formations (sprint 4) : une ligne de boutons par équipe, créée par
           src/formation-panel.js à partir des formations enregistrées. -->
      <div id="formation-panel" class="formation-panel" hidden></div>
      <div class="actions">
        <button id="formations-toggle" class="button button--secondary" type="button" aria-expanded="false" aria-controls="formation-panel">Formations</button>
        <button id="copy-flag" class="button button--secondary" type="button" hidden>Copier l’adresse du réglage</button>
        <button id="install-app" class="button button--secondary" type="button" hidden>Installer l’application</button>
        <button id="reset-view" class="button" type="button">Recentrer</button>
        <button id="enter-ar" class="button" type="button" hidden>Entrer en AR</button>
        <button id="move-pitch" class="button button--secondary" type="button" hidden>Déplacer le terrain</button>
        <button id="exit-ar" class="button button--secondary" type="button" hidden>Quitter l’AR</button>
      </div>
    </footer>
  </div>

  <!-- Écran de chargement, masqué dès que la scène est prête ; message d'erreur si WebGPU manque -->
  <div id="loader" class="loader" role="status">Chargement du terrain…</div>

  <!-- Message affiché si JavaScript est désactivé -->
  <noscript>
    <p class="noscript">Football Simulator a besoin de JavaScript pour afficher le terrain.</p>
  </noscript>
</body>
</html>
